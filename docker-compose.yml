# 대체용 DB입니다. 기본 DB는 Supabase 로컬이며 루트에서 `npm run db:start`로 켭니다.
# 이미지는 운영(Supabase)·기본 로컬 DB(Supabase CLI)·CI와 같은 PostgreSQL 17입니다.
# PostgreSQL 16 시절에 만든 볼륨(pgdata)이 남아 있으면 17이 그 데이터로 시작하지 못하고 바로 꺼집니다
# (`docker compose logs db`에 "database files are incompatible with server"). README의 "대체용 DB를 16에서 17로 옮기기"를 보세요.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: starter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 로컬 가짜 메일함. 실제로는 아무 데도 보내지 않습니다.
  # backend/.env 에 MAIL_BACKEND=smtp, MAIL_SMTP_HOST=localhost, MAIL_SMTP_PORT=1025 → 받은 메일은 http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # 웹 화면
      - "1025:1025" # SMTP

volumes:
  pgdata:
